<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pedido</title>

    <style>
        body {
            text-align: center;
        }

        form {
            display: inline-block;
            padding: 1em;
            border: 1px solid #cccccc;
            border-radius: 1em;
        }

        p + p {
            margin-top: 1em;
        }

        label {
            display: inline-block;
            min-width: 90px;
            text-align: right;
        }

        input,
        textarea {
            font: 1em sans-serif;
            width: 300px;
            box-sizing: border-box;
            border: 1px solid #999999;
        }

        input:focus,
        textarea:focus {
            outline-style: solid;
            outline-color: black;
        }

        .button {
            padding-left: 90px;
        }

        button {
            margin-left: 0.5em;
        }
    </style>
</head>
<body>

<form action="" method="get" class="form">
    <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" />
    </p>
    <p>
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" />
    </p>
    <p>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" name="precio" />
    </p>
    <p class="button">
        <input type="submit" value="Search"/>
    </p>
</form>

    <h1 th:text="${nombre}"></h1>
    <p th:text="'Precio: ' + ${precio}"></p>
    <p th:text="'Cantidad: ' + ${cantidad}"></p>
    <p th:text="'Base: ' + ${base}"></p>
    <p th:text="'IVA (21%): ' + ${iva}"></p>
    <p th:text="'Total: ' + ${total}"></p>

</body>
</html>
